name: Build and Push Images to ECR

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 298713974306.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -f apps/${{ matrix.service }}/Dockerfile \
            -t ${{ env.ECR_REGISTRY }}/roomate-${{ matrix.service }}:latest \
            -t ${{ env.ECR_REGISTRY }}/roomate-${{ matrix.service }}:${{ github.sha }} \
            .

      - name: Push image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/roomate-${{ matrix.service }}:latest
          docker push ${{ env.ECR_REGISTRY }}/roomate-${{ matrix.service }}:${{ github.sha }}
